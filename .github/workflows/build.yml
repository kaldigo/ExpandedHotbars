name: Build fork

on:
  push:
    branches: [master, main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          submodules: recursive
      - uses: ./.github/actions/build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check configuration compatibility, merge policy and package
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet run --project tests/ConfigurationChecks -c Release
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tools/check_package.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: ExpandedHotbars-development
          path: ExpandedHotbars/bin/Release/**
          if-no-files-found: error
