name: Release fork
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: expanded-hotbars-release
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'kaldigo/ExpandedHotbars'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          submodules: recursive
      - uses: ./.github/actions/build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Package release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python tools/package_release.py --tag "$env:RELEASE_TAG"
      - name: Publish preview and update source feed
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: pwsh
        run: |
          gh release create $env:RELEASE_TAG artifacts/ExpandedHotbars.zip artifacts/pluginmaster.json artifacts/SHA256SUMS.txt --prerelease --title "ExpandedHotbars $env:RELEASE_TAG" --notes 'Kaldigo fork: optional per-hotbar Close After Use for mouse clicks and keybinds, plus a matching icon. Auto-close includes activation attempts on cooldown. In-game acceptance testing remains pending. Disable the upstream ExpandedHotbars before loading this fork. Install through https://raw.githubusercontent.com/kaldigo/DalamudPlugins/main/pluginmaster.json .'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $feedPath = Join-Path $env:RUNNER_TEMP 'expanded-hotbars-feed.json'
          Copy-Item pluginmaster.json $feedPath
          git fetch origin $env:DEFAULT_BRANCH
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git switch -C $env:DEFAULT_BRANCH "origin/$env:DEFAULT_BRANCH"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item $feedPath pluginmaster.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pluginmaster.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 1) {
            git commit -m "Update ExpandedHotbars release feed for $env:RELEASE_TAG"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            git push origin $env:DEFAULT_BRANCH
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          } elseif ($LASTEXITCODE) { exit $LASTEXITCODE }
